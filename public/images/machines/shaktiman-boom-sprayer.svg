<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="40%" stop-color="#4d7c0f"/>
      <stop offset="100%" stop-color="#365314"/>
    </linearGradient>
    <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="boomGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="sprayMist" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#7dd3fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sky & Field -->
  <rect width="800" height="320" fill="url(#skyGrad)"/>
  <rect y="310" width="800" height="190" fill="url(#fieldGrad)"/>
  <ellipse cx="400" cy="440" rx="360" ry="24" fill="#14532d" opacity="0.4"/>

  <!-- Crop rows in background -->
  <path d="M 0 320 Q 200 315 400 320 T 800 320 L 800 340 L 0 340 Z" fill="#84cc16" opacity="0.6"/>
  <path d="M 0 340 Q 250 335 500 340 T 800 340 L 800 365 L 0 365 Z" fill="#4d7c0f" opacity="0.7"/>

  <!-- Tractor silhouette/rear mounting frame in center -->
  <g filter="url(#shadow)">
    <!-- 3-point hitch connection arms -->
    <path d="M 330 380 L 370 290 L 430 290 L 470 380 Z" fill="url(#steelGrad)"/>
    <rect x="360" y="270" width="80" height="40" rx="6" fill="#1e293b"/>
    <circle cx="400" cy="290" r="12" fill="#94a3b8"/>
    <circle cx="400" cy="290" r="6" fill="#0f172a"/>

    <!-- Main Chemical Tank 600L -->
    <rect x="310" y="150" width="180" height="150" rx="28" fill="url(#tankGrad)" stroke="#a16207" stroke-width="4"/>
    <rect x="340" y="130" width="120" height="25" rx="8" fill="#ca8a04"/>
    <ellipse cx="400" cy="130" rx="35" ry="10" fill="#facc15" stroke="#854d0e" stroke-width="2"/>
    <rect x="385" y="118" width="30" height="14" rx="4" fill="#a16207"/>

    <!-- Level indicator tube -->
    <rect x="330" y="170" width="8" height="110" rx="4" fill="#ffffff" opacity="0.8" stroke="#78350f" stroke-width="1.5"/>
    <rect x="331" y="200" width="6" height="78" rx="3" fill="#0284c7" opacity="0.85"/>

    <!-- Shaktiman Brand Emblem on Tank -->
    <rect x="350" y="195" width="100" height="32" rx="6" fill="#ffffff" stroke="#eab308" stroke-width="2"/>
    <text x="400" y="212" font-family="Arial, sans-serif" font-weight="900" font-size="12" fill="#ea580c" text-anchor="middle">SHAKTIMAN</text>
    <text x="400" y="223" font-family="Arial, sans-serif" font-weight="700" font-size="8" fill="#0f172a" text-anchor="middle">AGROBOOM 600L</text>

    <!-- Diaphragm Pump & Manifold Controls -->
    <rect x="365" y="295" width="70" height="45" rx="5" fill="#334155"/>
    <circle cx="380" cy="315" r="12" fill="#ef4444"/>
    <circle cx="415" cy="315" r="10" fill="#22c55e"/>
    <!-- Pressure gauge -->
    <circle cx="435" cy="275" r="14" fill="#ffffff" stroke="#334155" stroke-width="3"/>
    <line x1="435" y1="275" x2="442" y2="268" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Central Vertical Mast Tower -->
    <rect x="388" y="100" width="24" height="210" fill="url(#steelGrad)"/>
    <line x1="400" y1="100" x2="400" y2="300" stroke="#1e293b" stroke-width="2" stroke-dasharray="8,6"/>

    <!-- Left Folding Boom (Extended - 12m Reach) -->
    <g id="leftBoom">
      <!-- Main Boom Truss -->
      <polygon points="390,180 80,195 80,210 390,205" fill="url(#boomGrad)" stroke="#9a3412" stroke-width="2"/>
      <line x1="390" y1="180" x2="80" y2="205" stroke="#f97316" stroke-width="3"/>
      <!-- Truss struts -->
      <line x1="330" y1="182" x2="310" y2="204" stroke="#ffedd5" stroke-width="2"/>
      <line x1="270" y1="185" x2="250" y2="205" stroke="#ffedd5" stroke-width="2"/>
      <line x1="210" y1="188" x2="190" y2="207" stroke="#ffedd5" stroke-width="2"/>
      <line x1="150" y1="191" x2="130" y2="208" stroke="#ffedd5" stroke-width="2"/>
      <line x1="90" y1="194" x2="80" y2="210" stroke="#ffedd5" stroke-width="2"/>
      <!-- Hydraulic stabilizer cylinder -->
      <line x1="390" y1="150" x2="230" y2="188" stroke="#0284c7" stroke-width="4"/>
      <!-- Chemical distribution pipe -->
      <line x1="380" y1="212" x2="80" y2="212" stroke="#0284c7" stroke-width="3.5"/>

      <!-- Nozzles with mist cones -->
      <g>
        <rect x="100" y="212" width="6" height="12" fill="#eab308"/>
        <polygon points="90,224 116,224 135,330 71,330" fill="url(#sprayMist)"/>
        
        <rect x="160" y="212" width="6" height="12" fill="#eab308"/>
        <polygon points="150,224 176,224 195,330 131,330" fill="url(#sprayMist)"/>

        <rect x="220" y="212" width="6" height="12" fill="#eab308"/>
        <polygon points="210,224 236,224 255,330 191,330" fill="url(#sprayMist)"/>

        <rect x="280" y="212" width="6" height="12" fill="#eab308"/>
        <polygon points="270,224 296,224 315,330 251,330" fill="url(#sprayMist)"/>

        <rect x="340" y="212" width="6" height="12" fill="#eab308"/>
        <polygon points="330,224 356,224 375,330 311,330" fill="url(#sprayMist)"/>
      </g>
    </g>

    <!-- Right Folding Boom (Extended) -->
    <g id="rightBoom">
      <polygon points="410,180 720,195 720,210 410,205" fill="url(#boomGrad)" stroke="#9a3412" stroke-width="2"/>
      <line x1="410" y1="180" x2="720" y2="205" stroke="#f97316" stroke-width="3"/>
      <!-- Truss struts -->
      <line x1="470" y1="182" x2="490" y2="204" stroke="#ffedd5" stroke-width="2"/>
      <line x1="530" y1="185" x2="550" y2="205" stroke="#ffedd5" stroke-width="2"/>
      <line x1="590" y1="188" x2="610" y2="207" stroke="#ffedd5" stroke-width="2"/>
      <line x1="650" y1="191" x2="670" y2="208" stroke="#ffedd5" stroke-width="2"/>
      <line x1="710" y1="194" x2="720" y2="210" stroke="#ffedd5" stroke-width="2"/>
      <!-- Hydraulic stabilizer cylinder -->
      <line x1="410" y1="150" x2="570" y2="188" stroke="#0284c7" stroke-width="4"/>
      <!-- Chemical pipe -->
      <line x1="420" y1="212" x2="720" y2="212" stroke="#0284c7" stroke-width="3.5"/>

      <!-- Nozzles with mist cones -->
      <g>
        <rect x="460" y="212" width="6" height="12" fill="#eab308"/>
        <polygon points="450,224 476,224 495,330 431,330" fill="url(#sprayMist)"/>

        <rect x="520" y="212" width="6" height="12" fill="#eab308"/>
        <polygon points="510,224 536,224 555,330 491,330" fill="url(#sprayMist)"/>

        <rect x="580" y="212" width="6" height="12" fill="#eab308"/>
        <polygon points="570,224 596,224 615,330 551,330" fill="url(#sprayMist)"/>

        <rect x="640" y="212" width="6" height="12" fill="#eab308"/>
        <polygon points="630,224 656,224 675,330 611,330" fill="url(#sprayMist)"/>

        <rect x="700" y="212" width="6" height="12" fill="#eab308"/>
        <polygon points="690,224 716,224 735,330 671,330" fill="url(#sprayMist)"/>
      </g>
    </g>
  </g>

  <!-- Spec badge in corner -->
  <g transform="translate(40, 40)">
    <rect width="180" height="52" rx="10" fill="#0f172a" opacity="0.88"/>
    <text x="16" y="24" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#ffffff">Shaktiman AgroBoom</text>
    <text x="16" y="42" font-family="Arial, sans-serif" font-size="11" fill="#38bdf8">600L Tank • 12m Folding Boom</text>
  </g>
</svg>
