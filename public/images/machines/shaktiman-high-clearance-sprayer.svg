<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hcSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="tallCrops" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="60%" stop-color="#365314"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="shaktimanBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="polyTank" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cabGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="hcShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Sky and Field with Tall Crop Canopy -->
  <rect width="800" height="340" fill="url(#hcSky)"/>
  <rect y="330" width="800" height="170" fill="url(#tallCrops)"/>
  <!-- Tall crop stalks (showing 1.5m clearance above crops) -->
  <g opacity="0.6">
    <path d="M 50 350 L 50 420 M 120 340 L 120 430 M 200 345 L 200 425 M 620 345 L 620 430 M 700 340 L 700 420 M 760 350 L 760 435" stroke="#a3e635" stroke-width="6" stroke-linecap="round"/>
  </g>
  <ellipse cx="400" cy="460" rx="360" ry="24" fill="#052e16" opacity="0.5"/>

  <!-- High-Clearance Sprayer Rig -->
  <g filter="url(#hcShadow)" transform="translate(60, 15)">
    <!-- Tall Portal Axle Legs (High ground clearance 1.5m) -->
    <!-- Front Left Portal Leg -->
    <rect x="220" y="210" width="22" height="150" rx="4" fill="#1e293b"/>
    <line x1="231" y1="210" x2="231" y2="350" stroke="#475569" stroke-width="4"/>
    <!-- Front Right Portal Leg -->
    <rect x="260" y="195" width="18" height="140" rx="3" fill="#0f172a"/>

    <!-- Rear Left Portal Leg -->
    <rect x="520" y="210" width="22" height="150" rx="4" fill="#1e293b"/>
    <line x1="531" y1="210" x2="531" y2="350" stroke="#475569" stroke-width="4"/>
    <!-- Rear Right Portal Leg -->
    <rect x="560" y="195" width="18" height="140" rx="3" fill="#0f172a"/>

    <!-- Tall Narrow Row-Crop Wheels (Designed to fit between crop rows without trampling) -->
    <!-- Front Right Wheel -->
    <ellipse cx="270" cy="360" rx="16" ry="60" fill="#0f172a"/>
    <ellipse cx="270" cy="360" rx="8" ry="32" fill="#ca8a04"/>

    <!-- Front Left Wheel -->
    <g transform="translate(230, 360)">
      <ellipse cx="0" cy="0" rx="20" ry="68" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
      <!-- Wheel rim -->
      <ellipse cx="0" cy="0" rx="10" ry="38" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#1e293b"/>
      <!-- Lug tire treads -->
      <line x1="-18" y1="-30" x2="-8" y2="-20" stroke="#475569" stroke-width="3"/>
      <line x1="-18" y1="0" x2="-8" y2="10" stroke="#475569" stroke-width="3"/>
      <line x1="-18" y1="30" x2="-8" y2="40" stroke="#475569" stroke-width="3"/>
    </g>

    <!-- Rear Right Wheel -->
    <ellipse cx="570" cy="360" rx="16" ry="60" fill="#0f172a"/>
    <ellipse cx="570" cy="360" rx="8" ry="32" fill="#ca8a04"/>

    <!-- Rear Left Wheel -->
    <g transform="translate(530, 360)">
      <ellipse cx="0" cy="0" rx="20" ry="68" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="10" ry="38" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#1e293b"/>
      <line x1="-18" y1="-30" x2="-8" y2="-20" stroke="#475569" stroke-width="3"/>
      <line x1="-18" y1="0" x2="-8" y2="10" stroke="#475569" stroke-width="3"/>
      <line x1="-18" y1="30" x2="-8" y2="40" stroke="#475569" stroke-width="3"/>
    </g>

    <!-- Elevated High-Clearance Chassis Bridge -->
    <rect x="200" y="195" width="370" height="28" rx="5" fill="#0f172a"/>
    <line x1="200" y1="205" x2="570" y2="205" stroke="#ea580c" stroke-width="4"/>

    <!-- 1000L Chemical Liquid Solution Tank in Center -->
    <path d="M 320 195 C 320 120 360 110 460 110 C 510 110 520 130 520 195 Z" fill="url(#polyTank)" stroke="#a16207" stroke-width="3"/>
    <!-- Tank calibration lines -->
    <line x1="335" y1="140" x2="355" y2="140" stroke="#78350f" stroke-width="2"/>
    <line x1="335" y1="160" x2="360" y2="160" stroke="#78350f" stroke-width="2"/>
    <line x1="335" y1="180" x2="355" y2="180" stroke="#78350f" stroke-width="2"/>
    <text x="368" y="164" font-family="Arial, sans-serif" font-weight="700" font-size="9" fill="#78350f">1000L</text>
    <!-- Top tank hatch / lid -->
    <rect x="400" y="98" width="50" height="14" rx="4" fill="#78350f"/>

    <!-- Front Panoramic Air-Conditioned Operator Cab -->
    <polygon points="180,195 180,100 280,100 295,195" fill="url(#shaktimanBody)" stroke="#9a3412" stroke-width="2"/>
    <!-- Glass windshield & windows -->
    <polygon points="185,190 185,110 240,110 240,190" fill="url(#cabGlass)" stroke="#0284c7" stroke-width="1.5"/>
    <polygon points="245,190 245,110 275,110 288,190" fill="url(#cabGlass)" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Operator silhouette inside -->
    <circle cx="215" cy="140" r="10" fill="#0f172a"/>
    <rect x="205" y="152" width="22" height="25" rx="4" fill="#0f172a"/>
    <!-- Roof AC unit and working roof lights -->
    <rect x="175" y="88" width="115" height="14" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="178" y="92" width="12" height="6" rx="2" fill="#fef08a"/>
    <rect x="195" y="92" width="12" height="6" rx="2" fill="#fef08a"/>

    <!-- Shaktiman Brand Emblem on Cab -->
    <rect x="330" y="200" width="160" height="20" rx="3" fill="#ffffff"/>
    <text x="410" y="214" font-family="Arial, sans-serif" font-weight="900" font-size="11" fill="#ea580c" text-anchor="middle">SHAKTIMAN RAKSHAK</text>

    <!-- Rear Hydraulic Mast & 16m Boom Assembly -->
    <rect x="525" y="70" width="18" height="135" fill="#1e293b"/>
    <!-- Hydraulic boom lift cylinder -->
    <line x1="535" y1="170" x2="570" y2="110" stroke="#0284c7" stroke-width="6"/>
    <!-- Main 16m Boom Truss (Extending outwards) -->
    <polygon points="535,110 720,135 720,150 535,130" fill="url(#shaktimanBody)" stroke="#9a3412" stroke-width="2"/>
    <line x1="535" y1="120" x2="720" y2="142" stroke="#facc15" stroke-width="2"/>
    <!-- Spray pipe line & nozzles with mist -->
    <line x1="540" y1="150" x2="720" y2="150" stroke="#0284c7" stroke-width="3"/>
    <rect x="580" y="150" width="4" height="8" fill="#eab308"/>
    <polygon points="575,158 589,158 605,230 559,230" fill="#38bdf8" opacity="0.35"/>
    <rect x="640" y="150" width="4" height="8" fill="#eab308"/>
    <polygon points="635,158 649,158 665,230 619,230" fill="#38bdf8" opacity="0.35"/>
    <rect x="700" y="150" width="4" height="8" fill="#eab308"/>
    <polygon points="695,158 709,158 725,230 679,230" fill="#38bdf8" opacity="0.35"/>
  </g>

  <!-- Spec badge -->
  <g transform="translate(40, 40)">
    <rect width="230" height="54" rx="10" fill="#0f172a" opacity="0.9"/>
    <text x="16" y="24" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#ffffff">Shaktiman Rakshak 1000</text>
    <text x="16" y="42" font-family="Arial, sans-serif" font-size="11" fill="#f97316">1000L Tank • 1.5m Clearance • 16m Boom</text>
  </g>
</svg>
